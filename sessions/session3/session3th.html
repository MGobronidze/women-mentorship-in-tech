<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3th session</title>
</head>
<body>
<!-- forms -->
 <form >
  <div class="form-group">
    <label for="text">შეიყვანეთ თქვენი სახელი</label>
    <input type="text" required id="text" name="text" placeholder="თქვენი სახელი">  
  </div>

  <label for="email">შეიყვანეთ თვქენი ელ. ფოსტა</label>
  <input type="email" required id="email" name="email" placeholder="თქვენი ელ. ფოსტა">

  <lable for="color">აარჩიეთ ფერი</lable>
  <input type="color" id="color" name="color">

  <label for="date">აირჩიეთ თარიღი</label>
  <input type="date" id="date" name="date">

  <label for="number">აირჩიეთ რიცხვი</label>
  <input type="number" id="number" name="number">

  <label for="range">აირჩიეთ რიცხვი</label>
  <input type="range" id="range" name="range">
  
  <label for="password">შეიყვანეთ პაროლი</label>
  <input type="password" id="password" name="password">

  <label for="search">ძიება</label>
  <input type="search" id="search" name="search">

  <label for="tel">ტელეფონის ნომერი</label>
  <input type="tel" id="tel" name="tel">  

  <lable for="textarea">აკონტაქტი</lable>
  <textarea id="textarea" name="textarea" placeholder="თქვენი კონტაქტი"></textarea>

  <label for="select">აირჩიეთ ქვეყანა</label>
  <select id="select" name="select">
    <option value="georgia">საქართველო</option>
    <option value="usa">აშშ</option>  

  <label for="checkbox">მომხმარებლის პირობების მიღება</label>
  <input type="checkbox" id="checkbox" name="checkbox"> 

  <lable for="file"></lable>
  <input type="file" id="file" name="file" accept=".pdf">
 </form>
