<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ამინდი</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="weather-app">
    <h1>ამინდი</h1>

    <form id="search-form" role="search">
      <label for="city-input" class="visually-hidden">ქალაქი</label>
      <input id="city-input" type="search" placeholder="მაგ. Tbilisi" autocomplete="off" required minlength="2" />
      <button type="submit">ძებნა</button>
    </form>

    <!-- aria-live: screen reader-ი ხმამაღლა ამცნობს ცვლილებებს (loading → შედეგი) -->
    <div id="weather-output" aria-live="polite"></div>

    <section aria-labelledby="fav-title">
      <h2 id="fav-title">ფავორიტი ქალაქები</h2>
      <ul id="favorites-list"></ul>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
